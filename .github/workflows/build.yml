name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Grant release permissions
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller build_exe.spec --noconfirm

        # Rename the file using the tag/branch name
      - name: Add version to filename
        run: mv dist/Audiscribe.exe dist/Audiscribe-${{ github.ref_name }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audiscribe-windows-${{ github.ref_name }}
          path: dist/Audiscribe-${{ github.ref_name }}.exe

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Audiscribe-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}